[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticpython"
version = "0.1.0"
description = "Agent-driven editable Python execution tape prototype"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
codex = ["openai-codex==0.1.0b3"]
mnist = ["torch>=2.4", "torchvision>=0.19"]
test = ["pytest>=8.0"]

[project.scripts]
agentpython = "agenticpython.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
